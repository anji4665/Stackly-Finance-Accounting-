<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Stackly</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   STACKLY — 404 PAGE  (light illustration theme)
   ========================================================= */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root{
  --blue:        #2c3ea8;
  --blue-dark:   #22307f;
  --blue-light:  #eef0fb;
  --red:         #d9534f;
  --green:       #66d19e;
  --pink:        #f4d8cf;

  --ink:         #15152b;
  --muted:       #6b7280;
  --bg:          #ffffff;

  --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-display: 'Space Grotesk', 'Inter', sans-serif;

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

html{ -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body{
  font-family: var(--font-primary);
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  overflow-x: hidden;
  position: relative;
}

/* soft ambient wash */
body::before{
  content:'';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 50% 0%,   rgba(44,62,168,.05) 0%, transparent 55%),
    radial-gradient(circle at 85% 90%,  rgba(217,83,79,.045) 0%, transparent 50%),
    radial-gradient(circle at 10% 85%,  rgba(102,209,158,.05) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* =========================================================
   FLOATING BACKGROUND BLOBS
   ========================================================= */
.bg-float{
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}
.bg-float span{
  position: absolute;
  bottom: -140px;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 32%,
              rgba(44,62,168,.10),
              rgba(44,62,168,.03) 65%,
              transparent 75%);
  animation: blobFloat linear infinite;
}
@keyframes blobFloat{
  0%   { transform: translateY(0) scale(1);        opacity: 0; }
  12%  { opacity: 1; }
  85%  { opacity: .9; }
  100% { transform: translateY(-125vh) scale(1.25); opacity: 0; }
}

/* =========================================================
   PAGE
   ========================================================= */
.page{
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 22px;
}

.content{
  width: 100%;
  max-width: 720px;
  text-align: center;
  animation: fadeUp .8s var(--ease-out) both;
}
@keyframes fadeUp{
  from{ opacity: 0; transform: translateY(22px); }
  to  { opacity: 1; transform: translateY(0); }
}

/* ---------- ILLUSTRATION ---------- */
.illustration{
  display: flex;
  justify-content: center;
  margin-bottom: 26px;
  animation: floatIllustration 5.5s ease-in-out infinite;
}
.illustration svg{
  width: 100%;
  max-width: 300px;
  height: auto;
  display: block;
}
@keyframes floatIllustration{
  0%, 100%{ transform: translateY(0); }
  50%     { transform: translateY(-9px); }
}

/* ---------- TEXT ---------- */
.title{
  font-family: var(--font-display);
  font-size: clamp(23px, 3.6vw, 40px);
  font-weight: 700;
  line-height: 1.22;
  letter-spacing: -0.6px;
  color: var(--ink);
  margin-bottom: 14px;
}

.subtitle{
  font-size: clamp(12.5px, 1.5vw, 14.5px);
  font-weight: 400;
  color: var(--muted);
  line-height: 1.65;
  max-width: 560px;
  margin: 0 auto 36px;
}

/* ---------- BUTTONS ---------- */
.actions{
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.btn{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 13px 30px;
  border-radius: 999px;
  font-family: inherit;
  font-size: 14.5px;
  font-weight: 600;
  letter-spacing: .2px;
  text-decoration: none;
  cursor: pointer;
  border: 2px solid transparent;
  outline: none;
  white-space: nowrap;
  transition: transform .28s var(--ease-out),
              box-shadow .28s var(--ease-out),
              background .28s var(--ease-out),
              color .28s var(--ease-out),
              border-color .28s var(--ease-out);
}
.btn svg{
  width: 17px;
  height: 17px;
  flex-shrink: 0;
  transition: transform .3s var(--ease-out);
}

/* outline (Go Back) */
.btn-outline{
  background: transparent;
  border-color: var(--blue);
  color: var(--blue);
}
.btn-outline:hover{
  background: var(--blue-light);
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(44,62,168,.16);
}
.btn-outline:hover svg{ transform: translateX(-4px); }
.btn-outline:active{ transform: translateY(0) scale(.98); }

/* solid (Back to Home) */
.btn-solid{
  background: var(--blue);
  border-color: var(--blue);
  color: #ffffff;
  box-shadow: 0 10px 26px rgba(44,62,168,.28);
}
.btn-solid:hover{
  background: var(--blue-dark);
  border-color: var(--blue-dark);
  transform: translateY(-2px);
  box-shadow: 0 16px 34px rgba(44,62,168,.34);
}
.btn-solid:hover svg{ transform: scale(1.12); }
.btn-solid:active{ transform: translateY(0) scale(.98); }

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width: 768px){
  .illustration svg{ max-width: 250px; }
  .illustration{ margin-bottom: 20px; }
}

@media (max-width: 520px){
  .page{ padding: 34px 18px 46px; }

  .illustration svg{ max-width: 210px; }
  .illustration{ margin-bottom: 16px; }

  .title{
    font-size: 22px;
    line-height: 1.3;
    letter-spacing: -0.3px;
  }

  .subtitle{
    font-size: 12.5px;
    margin-bottom: 28px;
  }

  .actions{
    flex-direction: column;
    gap: 12px;
    width: 100%;
  }
  .btn{
    width: 100%;
    max-width: 300px;
    padding: 13px 22px;
    font-size: 14px;
  }
}

@media (prefers-reduced-motion: reduce){
  *,
  *::before,
  *::after{
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<!-- =========================================================
     FLOATING BACKGROUND BLOBS
     ========================================================= -->
<div class="bg-float" id="bgFloat"></div>

<!-- =========================================================
     MAIN CONTENT
     ========================================================= -->
<main class="page">
  <div class="content">

    <!-- ---------- ILLUSTRATION ---------- -->
    <div class="illustration">
      <svg viewBox="0 0 340 286" role="img" aria-label="404 page not found illustration"
           xmlns="http://www.w3.org/2000/svg">

        <defs>
          <clipPath id="monitorClip">
            <rect x="41.5" y="23.5" width="257" height="175" rx="13"/>
          </clipPath>
        </defs>

        <!-- ===== STAND (behind the monitor) ===== -->
        <polygon points="144,186 196,186 214,246 126,246"
                 fill="#f4d8cf" stroke="#2c3ea8" stroke-width="6"
                 stroke-linejoin="round"/>
        <circle cx="170" cy="222" r="7" fill="#2c3ea8"/>

        <!-- ===== BASE ===== -->
        <rect x="112" y="244" width="116" height="21" rx="10.5"
              fill="#f4d8cf" stroke="#2c3ea8" stroke-width="6"/>

        <!-- ===== MONITOR BODY ===== -->
        <rect x="38" y="20" width="264" height="182" rx="16"
              fill="#ffffff" stroke="#2c3ea8" stroke-width="7"/>

        <!-- ===== MONITOR INTERIOR ===== -->
        <g clip-path="url(#monitorClip)">

          <!-- top bar background -->
          <rect x="41.5" y="23.5" width="257" height="40" fill="#ffffff"/>

          <!-- red angular shape (top right) -->
          <polygon points="204,23.5 298.5,23.5 298.5,63.5 178,63.5" fill="#d9534f"/>

          <!-- three dots on the red shape -->
          <circle cx="240" cy="43.5" r="5.5" fill="#2c3ea8"/>
          <circle cx="262" cy="43.5" r="5.5" fill="#2c3ea8"/>
          <circle cx="284" cy="43.5" r="5.5" fill="#2c3ea8"/>

          <!-- left dot + search pill -->
          <circle cx="58" cy="43.5" r="5.5" fill="#2c3ea8"/>
          <rect x="76" y="35" width="92" height="17" rx="8.5"
                fill="#ffffff" stroke="#2c3ea8" stroke-width="4"/>

          <!-- separator line -->
          <rect x="41.5" y="60.5" width="257" height="5" fill="#2c3ea8"/>

          <!-- 404 text -->
          <text x="170" y="150"
                text-anchor="middle"
                font-family="'Space Grotesk','Inter',sans-serif"
                font-size="74"
                font-weight="700"
                letter-spacing="1"
                fill="#2c3ea8">404</text>

          <!-- green bar -->
          <rect x="58" y="168" width="224" height="22" rx="11" fill="#66d19e"/>

        </g>
      </svg>
    </div>

    <!-- ---------- TEXT ---------- -->
    <h1 class="title">Oops, This Page Could Not Be Found</h1>
    <p class="subtitle">
      The page you are looking for might have been removed,
      had its name changed, or is temporarily unavailable.
    </p>

    <!-- ---------- BUTTONS ---------- -->
    <div class="actions">
      <button type="button" class="btn btn-outline" onclick="goBack()" aria-label="Go back to previous page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Go Back
      </button>

      <a href="index.html" class="btn btn-solid" aria-label="Go back to homepage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Back to Home
      </a>
    </div>

  </div>
</main>

<!-- =========================================================
     SCRIPTS
     ========================================================= -->
<script>
/* =====================================================
   FLOATING BACKGROUND BLOBS
   ===================================================== */
(function () {
  const container = document.getElementById('bgFloat');
  if (!container) return;

  for (let i = 0; i < 10; i++) {
    const span = document.createElement('span');
    const size = 60 + Math.random() * 190;

    span.style.width             = size + 'px';
    span.style.height            = size + 'px';
    span.style.left              = (Math.random() * 92) + '%';
    span.style.animationDuration = (16 + Math.random() * 16) + 's';
    span.style.animationDelay    = (-Math.random() * 20) + 's';

    container.appendChild(span);
  }
})();

/* =====================================================
   GO BACK
   ===================================================== */
function goBack() {
  if (document.referrer && document.referrer !== window.location.href) {
    window.history.back();
  } else {
    window.location.href = 'index.html';
  }
}

/* keyboard shortcut: Escape → go back */
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') goBack();
});
</script>

</body>
</html>
